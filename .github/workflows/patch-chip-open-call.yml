name: Patch chip open-call status

on:
  push:
    branches: [agent-chip-network-4-1-validation]
    paths:
      - '.github/workflows/patch-chip-open-call.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-chip-network-4-1-validation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add open-call display metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('chip-network/app-v4.js')
          text = path.read_text(encoding='utf-8')
          old_meta = "    funded: { label: 'Funded', dash: '14 4 3 4' },\n    implementation:"
          new_meta = "    funded: { label: 'Funded', dash: '14 4 3 4' },\n    open_call: { label: 'Open call', dash: '2 5' },\n    implementation:"
          old_legend = "        ['signed', 'Signed'],\n        ['announced', 'Announced']"
          new_legend = "        ['signed', 'Signed'],\n        ['open_call', 'Open call'],\n        ['announced', 'Announced']"
          if old_meta not in text:
              raise SystemExit('STATUS_META insertion point not found')
          if old_legend not in text:
              raise SystemExit('legend insertion point not found')
          text = text.replace(old_meta, new_meta, 1).replace(old_legend, new_legend, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check chip-network/app-v4.js
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/patch-chip-open-call.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chip-network/app-v4.js .github/workflows/patch-chip-open-call.yml
          git commit -m 'Display open cooperation calls correctly'
          git push origin HEAD:agent-chip-network-4-1-validation
