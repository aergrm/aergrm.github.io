name: Publish current CV PDF

on:
  push:
    paths:
      - ".cv-upload-final/READY"

permissions:
  contents: write

jobs:
  update-cv:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify CV PDF
        shell: bash
        run: |
          set -euo pipefail
          cat .cv-upload-final/chunk*.b64 | base64 --decode > assets/pdf/ahmet-ergurum-cv.pdf
          test "$(head -c 4 assets/pdf/ahmet-ergurum-cv.pdf)" = "%PDF"
          grep -a -q '%%EOF' assets/pdf/ahmet-ergurum-cv.pdf
          test "$(wc -c < assets/pdf/ahmet-ergurum-cv.pdf | tr -d ' ')" = "181551"
          echo "56ebd422a0662143602ae8c4d2182bcebfe41420c9a18a39b95b129bbf402bff  assets/pdf/ahmet-ergurum-cv.pdf" | sha256sum -c -

      - name: Commit CV and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pdf/ahmet-ergurum-cv.pdf
          if [ -f assets/pdf/Ahmet_Ergurum_CV.pdf ]; then git rm assets/pdf/Ahmet_Ergurum_CV.pdf; fi
          git rm -r .cv-upload-final
          if [ -d .cv-upload-current ]; then git rm -r .cv-upload-current; fi
          if [ -d .cv-upload ]; then git rm -r .cv-upload; fi
          git rm .github/workflows/update-current-cv.yml
          git commit -m "Publish updated website CV"
          git push
