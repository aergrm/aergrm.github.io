name: Update current CV PDF

on:
  push:
    paths:
      - ".cv-upload-current/READY"

permissions:
  contents: write

jobs:
  update-cv:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify CV PDF
        shell: bash
        run: |
          set -euo pipefail
          cat .cv-upload-current/chunk*.b64 | base64 --decode > assets/pdf/Ahmet_Ergurum_CV.pdf
          test "$(head -c 4 assets/pdf/Ahmet_Ergurum_CV.pdf)" = "%PDF"
          grep -a -q '%%EOF' assets/pdf/Ahmet_Ergurum_CV.pdf
          test "$(wc -c < assets/pdf/Ahmet_Ergurum_CV.pdf | tr -d ' ')" = "181549"
          echo "532cbe68cf0443bc6672bf0feea427fe45b0ff2d22b5be1759f7c848f26264e1  assets/pdf/Ahmet_Ergurum_CV.pdf" | sha256sum -c -

      - name: Commit current CV and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pdf/Ahmet_Ergurum_CV.pdf
          git rm -r .cv-upload-current
          if [ -d .cv-upload ]; then git rm -r .cv-upload; fi
          git rm .github/workflows/update-current-cv.yml
          git commit -m "Update website CV"
          git push
