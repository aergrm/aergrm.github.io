name: Deploy chip network

on:
  push:
    branches: [main]
    paths:
      - 'chip-network/**'
      - '.github/workflows/deploy-chip-network.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chip-network-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish chip network directory
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./chip-network
          destination_dir: chip-network
          keep_files: true
          enable_jekyll: false
          commit_message: 'Deploy chip network from ${{ github.sha }}'
