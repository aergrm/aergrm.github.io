name: Update chip trade cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-chip-trade.yml"
      - "chip-network/refresh_trade_cache.py"
      - "chip-network/data.js"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh UN Comtrade cache
        run: python chip-network/refresh_trade_cache.py
      - name: Commit refreshed cache
        run: |
          if git diff --quiet -- chip-network/trade-cache.js; then
            echo "No cache change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chip-network/trade-cache.js
          git commit -m "Refresh chip trade cache"
          git push
