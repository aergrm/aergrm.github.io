name: Build and deploy Jekyll site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact POL SCI 335 syllabus PDF
        shell: bash
        run: |
          cat assets/pdf/polsci335_pdf/part01.txt \
              assets/pdf/polsci335_pdf/part02.txt \
              assets/pdf/polsci335_pdf/part03.txt \
              assets/pdf/polsci335_pdf/part04.txt \
            | tr -d '\r\n ' \
            | base64 --decode \
            > assets/pdf/polsci_335_2026_spring.pdf
          echo "7d8bca72b3b2b25cc7c11770faf750b387666896108ede817d30ff432020c6ec  assets/pdf/polsci_335_2026_spring.pdf" | sha256sum --check
          test "$(stat -c%s assets/pdf/polsci_335_2026_spring.pdf)" -eq 133176

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
